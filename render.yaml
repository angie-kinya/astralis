# Render Blueprint -- infrastructure as code.
#
# The whole deployed topology lives in this file rather than in a dashboard
# nobody can diff, review, or roll back. Change it in a PR like anything else.
#
# NOTE: plan names and free-tier terms change. Verify at render.com/pricing
# before relying on them. Free web services sleep when idle; the first request
# after a nap is slow, which is fine for a friends-only beta.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: astralis-api
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to Nairobi
    rootDir: services/gateway
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase: { name: astralis-db, property: connectionString }
      - key: REDIS_ADDR
        fromService: { type: redis, name: astralis-redis, property: connectionString }
      - key: BACKEND_JWT_SECRET
        sync: false            # must equal AUTH_BACKEND_SECRET on the frontend
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false            # your deployed frontend origin, no trailing slash
      - key: SAFETY_CLASSIFIER_URL
        fromService: { type: pserv, name: astralis-safety, property: hostport }

  # ---------------------------------------------------------------- worker
  # Same image, same commit, different entrypoint.
  - type: worker
    name: astralis-worker
    runtime: docker
    plan: starter              # background workers are not on the free tier
    region: frankfurt
    rootDir: services/gateway
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/worker
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: astralis-db, property: connectionString }
      - key: REDIS_ADDR
        fromService: { type: redis, name: astralis-redis, property: connectionString }
      - key: BACKEND_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ---------------------------------------------------------------- safety
  # Private service: reachable from the API over Render's internal network,
  # never from the public internet. The most sensitive text in the system
  # reaches this container, so it should have no public surface at all.
  - type: pserv
    name: astralis-safety
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: services/safety-classifier
    dockerfilePath: ./Dockerfile

  # ---------------------------------------------------------------- research
  - type: cron
    name: astralis-research
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: services/research
    dockerfilePath: ./Dockerfile
    schedule: "0 3 * * 0"      # 03:00 UTC every Sunday -- the self-research loop
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: astralis-db, property: connectionString }
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: text-embedding-3-small

  - type: redis
    name: astralis-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction   # Asynq loses queued jobs under any eviction policy

databases:
  - name: astralis-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
