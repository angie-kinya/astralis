services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astralis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astralis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-astralis}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astralis"]
      interval: 5s
      retries: 10
      
  redis:
    image: docker.io/redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata: