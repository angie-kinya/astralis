# The two jobs that make Astralis self-improving, on a schedule, for free.
#
# GitHub Actions is doing the work a Render cron and a Render background worker
# would otherwise do — both of which are paid. Neither job needs to be online
# between runs, so a scheduled runner is genuinely the right tool and not only
# the cheap one.
name: scheduled

on:
  schedule:
    - cron: "0 3 * * 0"    # research ingestion — 03:00 UTC Sundays
    - cron: "*/20 * * * *" # episodic memory — every 20 minutes
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        type: choice
        options: [summarise, research]
        default: summarise

jobs:
  # ---------------------------------------------------------------- memory
  summarise:
    if: github.event.schedule == '*/20 * * * *' || inputs.job == 'summarise'
    runs-on: ubuntu-latest
    # A slow LLM provider should fail the run, not hold a runner for an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      - name: write episodic memory
        working-directory: services/gateway
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          BACKEND_JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          ENV: production
        run: go run ./cmd/summarise -idle 30m -n 25

  # ---------------------------------------------------------------- research
  research:
    if: github.event.schedule == '0 3 * * 0' || inputs.job == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: services/research }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/research/requirements.txt
      - run: pip install -r requirements.txt
      - name: grow the knowledge base
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          EMBED_MODEL:     text-embedding-3-small
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python main.py --all
