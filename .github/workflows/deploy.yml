# Ships main to the droplet, but only after `test` has gone green on it.
#
#   test (green on main) -> build 4 images -> push to ghcr.io -> ssh -> update.sh
#
# Images are built here, never on the droplet: a Next.js build needs more
# memory than a 2 GB machine can spare while it is also serving traffic.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DROPLET_HOST         the droplet's IP or domain
#   DROPLET_SSH_KEY      private key for the `deploy` user (the whole file)
#   DROPLET_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <DROPLET_HOST>`
# Variable (same page, Variables tab — not secret):
#   PUBLIC_URL           https://your-domain, used to verify from the outside
name: deploy

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy half way through

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api,        context: services/gateway }
          - { name: web,        context: web }
          - { name: classifier, context: services/safety-classifier }
          - { name: research,   context: services/research }
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit that passed the tests, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/astralis-${{ matrix.name }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/astralis-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: roll the droplet forward
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY"   > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: without it, the first connection would trust
          # whatever answered — the definition of a man-in-the-middle.
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh deploy@"$HOST" "TAG=$TAG /opt/astralis/deploy/update.sh"

      # Through DNS, TLS and Caddy — the path a real visitor takes. The IP
      # would fail here anyway: the certificate is issued for the domain.
      - name: verify from the outside
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          for i in $(seq 1 20); do
            curl -fsS "$URL/healthz" && exit 0
            sleep 6
          done
          echo "::error::$URL/healthz did not answer"; exit 1
